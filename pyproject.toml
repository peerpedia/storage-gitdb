[project]
name = "peerpedia-storage-gitdb"
version = "0.2.0"
description = "PeerPedia Storage GitDB — git + SQLite implementation of ArticleStorage"
requires-python = ">=3.11"
license = "AGPL-3.0"
authors = [
    {name = "Chenqi Meng", email = "chenqimeng@example.com"},
]
dependencies = [
    "peerpedia-core>=0.1.0",
    "sqlalchemy>=2.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/peerpedia/storage-gitdb"
Issues = "https://github.com/peerpedia/storage-gitdb/issues"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["peerpedia_storage_gitdb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
